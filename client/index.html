<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title and meta — overridden per-page by useSeoMeta hook -->
    <title>The Orbis Journal</title>
    <meta name="description" content="Independent journalism on human rights, minorities, and social justice in India and beyond." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="The Orbis Journal" />
    <meta property="og:type"      content="website" />
    <meta property="og:title"     content="The Orbis Journal" />
    <meta property="og:description" content="Independent journalism on human rights, minorities, and social justice in India and beyond." />
    <meta property="og:image"     content="https://theorbisjournal.in/og-default.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"       content="https://theorbisjournal.in" />

    <!-- Twitter / X Card defaults -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@theorbisjournal" />
    <meta name="twitter:title"       content="The Orbis Journal" />
    <meta name="twitter:description" content="Independent journalism on human rights, minorities, and social justice in India and beyond." />
    <meta name="twitter:image"       content="https://theorbisjournal.in/og-default.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://theorbisjournal.in" />
  </head>
  <body>
    <div id="root">
      <!--
        Static placeholder shown only until React mounts and takes over.
        Self-contained (its own inline <style>, no dependency on the app's
        CSS/JS bundle) so it appears the instant the HTML itself loads —
        this is what closes the "blank white page" gap before the app's own
        skeletons take over. Mirrors the real masthead + nav + hero/grid
        layout so it reads as "the page is arriving," not as a placeholder.
        React replaces this div's contents on mount; nothing here needs
        cleanup.
      -->
      <style>
        @keyframes orbis-shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
        .orbis-shimmer {
          background-color: #eeede8;
          background-image: linear-gradient(90deg, #eeede8 25%, #f5f4f0 37%, #eeede8 63%);
          background-size: 800px 100%;
          animation: orbis-shimmer 1.4s ease-in-out infinite;
        }
      </style>
      <div style="min-height:100vh;display:flex;flex-direction:column;background:#fafaf8;">

        <!-- Masthead -->
        <div style="background:#fbfc09;padding:18px 24px;">
          <div style="max-width:1240px;margin:0 auto;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:26px;color:#122837;">The Orbis Journal</span>
            <div style="font-family:system-ui,sans-serif;font-weight:800;font-size:10px;letter-spacing:2px;color:rgba(18,40,55,0.5);margin-top:2px;">
              HUMAN RIGHTS &middot; MINORITIES &middot; JUSTICE
            </div>
          </div>
        </div>

        <!-- Nav bar -->
        <div style="background:#122837;padding:14px 24px;">
          <div style="max-width:1240px;margin:0 auto;display:flex;gap:22px;">
            <div style="width:46px;height:9px;border-radius:2px;background:#fbfc09;"></div>
            <div style="width:64px;height:9px;border-radius:2px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:58px;height:9px;border-radius:2px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:50px;height:9px;border-radius:2px;background:rgba(255,255,255,0.15);"></div>
            <div style="width:70px;height:9px;border-radius:2px;background:rgba(255,255,255,0.15);"></div>
          </div>
        </div>

        <!-- Content -->
        <div style="max-width:1240px;margin:0 auto;padding:32px 24px;width:100%;box-sizing:border-box;">
          <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:40px;">
            <div class="orbis-shimmer" style="height:340px;border-radius:10px;"></div>
            <div style="display:flex;flex-direction:column;gap:16px;">
              <div class="orbis-shimmer" style="height:16px;width:60%;border-radius:4px;"></div>
              <div class="orbis-shimmer" style="height:16px;width:80%;border-radius:4px;"></div>
              <div class="orbis-shimmer" style="height:16px;width:70%;border-radius:4px;"></div>
              <div class="orbis-shimmer" style="height:16px;width:85%;border-radius:4px;"></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">
            <div class="orbis-shimmer" style="height:220px;border-radius:10px;"></div>
            <div class="orbis-shimmer" style="height:220px;border-radius:10px;"></div>
            <div class="orbis-shimmer" style="height:220px;border-radius:10px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
